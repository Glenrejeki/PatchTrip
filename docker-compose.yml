version: '3.8'

services:
  # 1. Layanan Database PostgreSQL
  db:
    image: postgres:15-alpine
    container_name: patchtrip_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: patchtrip_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - patchtrip_network
    restart: always

  # 2. Layanan Backend FastAPI
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: patchtrip_backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend:/app
      - backend_vector_store:/app/backend/data/vector_store
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:password123@db:5432/patchtrip_db
      - VECTOR_STORE_PATH=/app/backend/data/vector_store
      - EMBEDDING_MODEL_PATH=BAAI/bge-m3
      - LLM_MODEL_NAME=Qwen/Qwen2.5-7B-Instruct
    depends_on:
      - db
    networks:
      - patchtrip_network
    restart: always

  # 3. Layanan Frontend Next.js
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: patchtrip_frontend
    command: npm run dev
    volumes:
      - ./frontend:/app
      - /app/.next
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
    depends_on:
      - backend
    networks:
      - patchtrip_network
    restart: always

volumes:
  postgres_data:
  backend_vector_store:

networks:
  patchtrip_network:
    driver: bridge